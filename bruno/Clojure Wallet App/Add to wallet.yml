info:
  name: Add to wallet
  type: http
  seq: 4

http:
  method: POST
  url: "{{server}}/wallet/:id/add"
  params:
    - name: id
      value: "{{$guid}}"
      type: path
  body:
    type: json
    data: |-
      {
        "amount": 2.54    
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
